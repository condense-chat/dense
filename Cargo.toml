[package]
name = "dense"
version = "0.15.0"
edition = "2024"
rust-version = "1.89"
description = "Durable condense CLI — login once, run Claude Code (and later Codex) through the condense proxy."
license = "MIT"
repository = "https://github.com/condense-chat/dense"
readme = "README.md"

[[bin]]
name = "dense"
path = "src/main.rs"

[features]
default = [
    "desktop-switch",
    "login-autostart",
    "managed-setup",
    "offline-usage",
    "remote-control",
    "session-repo",
]
# Claude Desktop's wrapped engines follow the org's off switch.
desktop-switch = ["remote-control"]
# `dense login` installs the daemon when the org manages the device.
login-autostart = []
# A managed device needs no setup: `on` routes Desktop and the installed tools.
managed-setup = ["desktop-switch", "login-autostart", "remote-control"]
# Managed devices report usage from Claude Code's session files.
offline-usage = []
# The daemon applies the org's on/off switch to routing.
remote-control = []
# Session heartbeats carry the git remote and HEAD.
session-repo = []

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt", "macros", "net", "time", "process", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
semver = "1"
sha2 = "0.10"
hex = "0.4"
webbrowser = { version = "1.2.2", features = ["hardened"] }
backon = "1"
cliclack = "0.5"
console = "0.16"
indicatif = "0.18"
textwrap = "0.16"
gethostname = "1"
self-replace = "1"
which = "8"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", features = ["process"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unwrap_in_result = "deny"
# Modules use self-named files (foo.rs + foo/), never mod.rs.
mod_module_files = "deny"
# Consistent in-file item ordering.
arbitrary_source_item_ordering = "deny"

[profile.release]
strip = true
lto = true
codegen-units = 1
# size over speed — this binary execs a child and polls HTTP; opt-level
# benchmarking showed no perceptible difference, panics are lint-banned.
opt-level = "s"
panic = "abort"
