<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 273" role="img" aria-labelledby="t d"><title id="t">Action agreement and goal rating</title><desc id="d">Control and Condense matched the original action on 46% and 24% of steps. The goal judge rated 58% and 63% good.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#192437;font-size:17px}.small{font-size:15px;fill:#44526a}.bold{font-weight:700}.blue{fill:#244cdd}.teal{fill:#08685f}</style><rect width="760" height="273" rx="12" fill="#f3f6fc"/><text x="28" y="34" class="bold" text-anchor="start">Two ways to score the same next step</text><text x="28" y="60" class="small" text-anchor="start">Share of steps · one 200-step Opus session</text><text x="28" y="112" class="bold" text-anchor="start">Same action</text><rect x="211" y="97" width="289.8" height="13" rx="3" fill="#68768c"/><text x="510.8" y="110" class="small" text-anchor="start">46%</text><rect x="211" y="121" width="151.2" height="13" rx="3" fill="#244cdd"/><text x="372.2" y="134" class="small" text-anchor="start">24%</text><text x="28" y="195" class="bold" text-anchor="start">Good for the goal</text><rect x="211" y="180" width="365.4" height="13" rx="3" fill="#68768c"/><text x="586.4" y="193" class="small" text-anchor="start">58%</text><rect x="211" y="204" width="396.9" height="13" rx="3" fill="#244cdd"/><text x="617.9" y="217" class="small" text-anchor="start">63%</text><rect x="211" y="242" width="14" height="10" rx="2" fill="#68768c"/><text x="232" y="252" class="small" text-anchor="start">Control</text><rect x="347" y="242" width="14" height="10" rx="2" fill="#244cdd"/><text x="368" y="252" class="small" text-anchor="start">Condense</text></svg>