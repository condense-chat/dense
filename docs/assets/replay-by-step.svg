<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 362" role="img" aria-labelledby="t d"><title id="t">When did the replay break even?</title><desc id="d">Cumulative input-token and cost savings at the checkpoints in the published Opus replay. At step ten cost was 23 percent higher. By step 192 it was 45 percent lower.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#192437;font-size:17px}.small{font-size:15px;fill:#44526a}.bold{font-weight:700}.blue{fill:#244cdd}.teal{fill:#08685f}</style><rect width="760" height="362" rx="12" fill="#f3f6fc"/><text x="28" y="32" class="bold" text-anchor="start">Cumulative savings vs. uncompressed control</text><text x="28" y="58" class="small" text-anchor="start">One Opus coding session · 192 shared steps</text><line x1="64" y1="276.3" x2="604" y2="276.3" stroke="#d4dce8" stroke-width="1" stroke-dasharray=""/><text x="55" y="281.3" class="small" text-anchor="end">-20%</text><line x1="64" y1="229.0" x2="604" y2="229.0" stroke="#7e8998" stroke-width="1" stroke-dasharray=""/><text x="55" y="234.0" class="small" text-anchor="end">0%</text><line x1="64" y1="181.7" x2="604" y2="181.7" stroke="#d4dce8" stroke-width="1" stroke-dasharray=""/><text x="55" y="186.7" class="small" text-anchor="end">20%</text><line x1="64" y1="134.39999999999998" x2="604" y2="134.39999999999998" stroke="#d4dce8" stroke-width="1" stroke-dasharray=""/><text x="55" y="139.39999999999998" class="small" text-anchor="end">40%</text><line x1="64" y1="87.1" x2="604" y2="87.1" stroke="#d4dce8" stroke-width="1" stroke-dasharray=""/><text x="55" y="92.1" class="small" text-anchor="end">60%</text><line x1="64" y1="293" x2="64" y2="298" stroke="#909aab" stroke-width="1" stroke-dasharray=""/><text x="64" y="319" class="small" text-anchor="middle">5</text><line x1="166.6" y1="293" x2="166.6" y2="298" stroke="#909aab" stroke-width="1" stroke-dasharray=""/><text x="166.6" y="319" class="small" text-anchor="middle">10</text><line x1="269.2" y1="293" x2="269.2